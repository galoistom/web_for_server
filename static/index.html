<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>MC Server Hub</title>
	<link rel="stylesheet" href="style.css">
	<link rel="icon" type="image/png" href="logo.png">
</head>
<body>
	<div id="file-overlay" class="hidden"></div>

	<header>
		<h1>MC 服务器控制台</h1>
		<div id="header-actions">
			<div id="status-container">unknown</div>
			<button id="file-toggle" title="文件管理">⚙️</button>
			<button id="theme-toggle" title="切换主题">🌙</button>
		</div>
	</header>

	<div id="file-panel" class="hidden">
		<div id="file-panel-header">
			<h2>文件管理</h2>
			<button id="file-panel-close">✕</button>
		</div>
		<div id="file-list"></div>
		<div id="file-editor" class="hidden">
			<div id="file-editor-info"></div>
			<textarea id="file-editor-content" spellcheck="false"></textarea>
			<div id="file-editor-actions">
				<button id="file-save-btn" class="btn btn-start">保存</button>
				<span id="file-save-msg"></span>
			</div>
		</div>
	</div>

	<main>
		<div id="button-container">
			<button onclick="startServer()" class="btn btn-start">启动服务器</button>
			<button onclick="stopServer()" class="btn btn-stop">停止服务器</button>
			<button onclick="refresh()" class="btn btn-refresh">刷新</button>
		</div>

		<div id="log-container">
			<div class="log-placeholder">等待连接...</div>
		</div>

		<div id="command-container">
			<textarea id="command-input" placeholder="输入 Minecraft 命令...（Enter 发送，Shift+Enter 换行）" rows="1"></textarea>
			<button id="send-btn" onclick="sendCommand()" class="btn btn-send">发送命令</button>
		</div>
	</main>

	<script src="main.js"></script>
</body>
</html>
