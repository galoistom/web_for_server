<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>MC Server Hub</title>
	<link rel="stylesheet" href="style.css">
	<link rel="icon" type="image/png" href="logo.png">
</head>
<body>
	<header>
		<h1>MC 服务器控制台</h1>
		<div id="header-actions">
			<div id="status-container">unknown</div>
			<button id="theme-toggle" title="切换主题">🌙</button>
		</div>
	</header>

	<main>
		<div id="button-container">
			<button onclick="startServer()" class="btn btn-start">启动服务器</button>
			<button onclick="stopServer()" class="btn btn-stop">停止服务器</button>
			<button onclick="refresh()" class="btn btn-refresh">刷新</button>
		</div>

		<div id="log-container">
			<div class="log-placeholder">等待连接...</div>
		</div>

		<div id="command-container">
			<input type="text" id="command-input" placeholder="输入 Minecraft 命令...">
			<button id="send-btn" onclick="sendCommand()" class="btn btn-send">发送命令</button>
		</div>
	</main>

	<script src="main.js"></script>
</body>
</html>
